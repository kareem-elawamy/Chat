<form [formGroup]="form" #userForm="ngForm" (ngSubmit)="login()"
  class="min-h-screen flex items-center justify-center bg-gray-100 px-4 md:px-20 py-10">
  <div class="bg-white rounded-2xl shadow-lg flex flex-col md:flex-row overflow-hidden w-full max-w-5xl">
    <div class="hidden md:block md:w-1/2 bg-cover bg-center" style="background-image: url('Login.png');"></div>
    <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">
      <div class="flex justify-center mb-4">
        <img src="loginIcon.jpg" class="rounded-full bg-blue-600 h-20 w-20 object-cover shadow-md" />
      </div>
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Login</h1>

      <mat-form-field class="w-full" appearance="fill">
        <mat-label>Email</mat-label>
        <input type="email" matInput name="email" placeholder="Email" required formControlName="email" />
        <mat-error *ngIf="form.controls['email'].errors && form.controls['email'].touched">
          Email is required
        </mat-error>
      </mat-form-field>

      <mat-form-field class="w-full mt-4" appearance="fill">
        <mat-label>Password</mat-label>
        <input required matInput [type]="hide() ? 'text' : 'password'" name="password" placeholder="Password"
          formControlName="password" />
        <button mat-icon-button matSuffix (click)="togglePassword($event)">
          <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        <mat-error *ngIf="form.controls['password'].errors && form.controls['password'].touched">
          Password is required
        </mat-error>
      </mat-form-field>

      <button type="submit"
        class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition disabled:opacity-50"
        [disabled]="!userForm.valid">
        Login
      </button>

      <p class="text-center mt-4 text-sm text-gray-700">
        Don't have an account?
        <a routerLink="/register" class="text-blue-600 font-semibold hover:underline">Register</a>
      </p>
    </div>
  </div>
</form>
