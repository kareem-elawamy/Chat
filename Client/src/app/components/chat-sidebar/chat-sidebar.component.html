<div class="flex flex-col h-full bg-[#0f172a] border-r border-white/5 relative overflow-hidden">

  <div class="flex items-center justify-between p-5 bg-white/5 border-b border-white/5 backdrop-blur-md z-10">
    <div class="flex items-center gap-3">
      <div class="relative group cursor-pointer">
        <div
          class="absolute -inset-0.5 bg-gradient-to-r from-pink-600 to-purple-600 rounded-full opacity-50 group-hover:opacity-100 blur transition duration-200">
        </div>
        <img class="relative h-11 w-11 rounded-full border-2 border-[#0f172a] object-cover"
          [src]="getUserImage(auth.currentLoggedUser?.profileIamge)" alt="">
      </div>
      <div>
        <div class="font-bold text-gray-100 tracking-wide">{{ auth.currentLoggedUser?.userName }}</div>
        <div class="text-[10px] text-green-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
          Online
        </div>
      </div>
    </div>

    <button mat-icon-button [matMenuTriggerFor]="menu" class="text-gray-400 hover:text-white transition-colors">
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" class="custom-menu-bg"> <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </div>

  <div class="px-4 py-4">
    <div class="relative group">
      <input [(ngModel)]="searchTerm" placeholder="Search contacts..." type="text"
        class="w-full h-10 pl-10 pr-4 rounded-xl text-sm text-gray-200 placeholder-gray-500 glass-input focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all outline-none" />
      <mat-icon
        class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 group-focus-within:text-blue-400 transition-colors text-lg">search</mat-icon>
    </div>
  </div>

  <div class="md:hidden px-4 pb-2 border-b border-white/5">
    <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wider">Online Now</p>
    <div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
      <div *ngFor="let user of filteredUsers()" class="flex-shrink-0 text-center">
        <button (click)="selectUser(user.id)" class="relative group">
          <div
            class="absolute -inset-0.5 bg-gradient-to-tr from-blue-500 to-cyan-500 rounded-full opacity-0 group-hover:opacity-100 blur transition duration-200"
            [ngClass]="{'opacity-100': receiverId === user.id}"></div>
          <img class="relative h-14 w-14 rounded-full border-2 border-[#0f172a] object-cover"
            [src]="getImage(user.profileIamge)" alt="">
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-[#0f172a]"
            [ngClass]="user.isOnline ? 'bg-emerald-500' : 'bg-gray-500'"></span>
        </button>
        <p class="text-[10px] text-gray-400 mt-1 truncate w-14">{{ user.fullName?.split(' ')?.[0] }}</p>
      </div>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto custom-scroll px-3 py-2 space-y-1">

    <div *ngFor="let user of filteredUsers()" class="user-card-anim">
      <button (click)="selectUser(user.id)"
        class="w-full flex items-center p-3 rounded-xl transition-all duration-300 group relative overflow-hidden"
        [ngClass]="{
                'bg-gradient-to-r from-blue-600/90 to-blue-500/90 shadow-lg shadow-blue-900/20': receiverId === user.id,
                'hover:bg-white/5 bg-transparent': receiverId !== user.id
              }">

        <div *ngIf="receiverId === user.id"
          class="absolute left-0 top-1/2 -translate-y-1/2 h-8 w-1 bg-white rounded-r-full shadow-[0_0_10px_white]">
        </div>

        <div class="relative mr-3">
          <img class="h-10 w-10 rounded-full object-cover border border-white/10" [src]="getImage(user.profileIamge)"
            alt="">
          <span *ngIf="user.isOnline"
            class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-[#0f172a] bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
        </div>

        <div class="flex-1 text-left overflow-hidden">
          <div class="flex justify-between items-center mb-0.5">
            <span class="text-sm font-semibold truncate"
              [ngClass]="receiverId === user.id ? 'text-white' : 'text-gray-200 group-hover:text-white'">
              {{ user.fullName }}
            </span>
            <span class="text-[10px]" [ngClass]="receiverId === user.id ? 'text-blue-100' : 'text-gray-500'">
              09:41
            </span>
          </div>

          <div class="flex justify-between items-center">
            <div class="text-xs truncate max-w-[140px]"
              [ngClass]="receiverId === user.id ? 'text-blue-100' : 'text-gray-400'">

              <div *ngIf="user.isTyping" class="mt-1">
                <app-typing-indicator></app-typing-indicator>
              </div>

              <span *ngIf="!user.isTyping">Hey, how are you do...</span>

            </div>

            <span *ngIf="user.unreadMessagesCount"
              class="flex items-center justify-center min-w-[18px] h-[18px] px-1 bg-blue-500 text-white text-[10px] font-bold rounded-full shadow-sm">
              {{ user.unreadMessagesCount }}
            </span>
          </div>
        </div>
      </button>
    </div>

    <div *ngIf="filteredUsers().length === 0" class="text-center py-10 opacity-50">
      <mat-icon class="text-4xl text-gray-600 mb-2">person_search</mat-icon>
      <p class="text-gray-400 text-sm">No users found</p>
    </div>

  </div>
</div>
