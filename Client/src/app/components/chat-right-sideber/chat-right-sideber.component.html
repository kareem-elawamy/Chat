<div class="p-3">
  <div class="flex flex-col text-center items-center mt-3">
    <img [src]="getImage(chat.receiverDetails?.profileIamge)"
         class="rounded-full mb-4 w-44 h-44 object-cover" alt="Select recipient" />
    <div class="ml-3">
      <p class="text-lg font-semibold">
        {{ chat.receiverDetails?.email || 'Select recipient' | titlecase }}
      </p>
      <p class="text-sm text-gray-500">
        {{ chat.receiverDetails?.userName || 'Select recipient' | titlecase }}
      </p>
    </div>
  </div>
</div>
