<div class="relative h-full w-full bg-[#0f172a] overflow-hidden flex flex-col justify-center items-center font-sans">

  <div #bgBlob1
    class="absolute top-10 left-10 w-64 h-64 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob">
  </div>
  <div #bgBlob2
    class="absolute bottom-10 right-10 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000">
  </div>

  <div *ngIf="chat.currentReceiverId == ''"
    class="z-10 text-center glass-effect p-10 rounded-2xl shadow-2xl border border-white/10">
    <div class="mb-4 relative inline-block">
      <div class="absolute inset-0 bg-blue-500 blur-xl opacity-50 rounded-full"></div>
      <mat-icon class="relative text-7xl text-white scale-110">mark_chat_unread</mat-icon>
    </div>
    <h2 class="text-3xl font-bold text-white mb-2 tracking-wide">Welcome Back</h2>
    <p class="text-gray-400">Select a contact to start the conversation.</p>
  </div>

  <div *ngIf="chat.currentReceiverId != ''"
    class="chat-container z-10 w-full h-full sm:w-[95%] sm:h-[95%] glass-effect rounded-none sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">

    <div class="flex items-center justify-between px-6 py-4 bg-white/5 border-b border-white/5 backdrop-blur-sm">
      <div class="flex items-center gap-4">
        <div class="relative group cursor-pointer">
          <div
            class="absolute -inset-0.5 bg-gradient-to-r from-pink-600 to-purple-600 rounded-full opacity-75 group-hover:opacity-100 transition duration-200 blur">
          </div>
          <img [src]="getImage(chat.receiverDetails?.profileIamge)"
            class="relative h-12 w-12 rounded-full object-cover border-2 border-[#0f172a]" alt="">
          <span class="absolute bottom-0 right-0 w-3.5 h-3.5 border-2 border-[#0f172a] rounded-full"
            [ngClass]="chat.receiverDetails?.isOnline ? 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.8)]' : 'bg-gray-500'"></span>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white tracking-wide">{{ chat.receiverDetails?.fullName }}</h2>
          <p *ngIf="chat.receiverDetails?.isTyping" class="text-xs text-blue-400 font-medium animate-pulse">Typing...
          </p>
          <p *ngIf="!chat.receiverDetails?.isTyping" class="text-xs text-gray-400">
            {{ chat.receiverDetails?.isOnline ? 'Online' : 'Offline' }}
          </p>
        </div>
      </div>

      <button (click)="display(chat.currentReceiverId)"
        class="p-3 rounded-full bg-white/5 hover:bg-white/10 text-white transition-all duration-300 hover:scale-110 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)]">
        <mat-icon>videocam</mat-icon>
      </button>
    </div>

    <div #scrollContainer class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar">
      <div *ngFor="let msg of chat.messages; let i = index" class="msg-row flex w-full"
        [ngClass]="msg.senderId === auth.currentLoggedUser?.id ? 'justify-end' : 'justify-start'">

        <div class="relative max-w-[75%] group">
          <div *ngIf="msg.senderId === auth.currentLoggedUser?.id"
            class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-200">
          </div>

          <div class="relative px-5 py-3 rounded-2xl text-[15px] leading-relaxed shadow-lg backdrop-blur-sm" [ngClass]="{
                 'bg-gradient-to-br from-blue-600 to-cyan-600 text-white rounded-br-none': msg.senderId === auth.currentLoggedUser?.id,
                 'bg-[#1e293b]/90 text-gray-100 border border-white/10 rounded-bl-none': msg.senderId !== auth.currentLoggedUser?.id
               }">
            {{ msg.content }}
          </div>

          <span class="text-[10px] text-gray-500 mt-1 block px-1"
            [ngClass]="msg.senderId === auth.currentLoggedUser?.id ? 'text-right' : 'text-left'">
            {{ msg.timeSent | date:'shortTime' }}
          </span>
        </div>
      </div>
    </div>

    <div class="p-4 bg-white/5 border-t border-white/5 backdrop-blur-md">
      <div
        class="flex items-center gap-3 bg-[#0f172a]/80 rounded-full px-2 py-2 border border-white/10 shadow-inner focus-within:border-blue-500/50 transition-all duration-300">

        <button class="p-2 rounded-full text-gray-400 hover:text-white transition-colors">
          <mat-icon>add_link</mat-icon>
        </button>

        <input [(ngModel)]="messageContent" (input)="chat.notifyTyping()" (keydown.enter)="sendMessage()" type="text"
          placeholder="Type something..."
          class="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 h-full" />

        <button (click)="sendMessage()"
          class="group w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg hover:shadow-[0_0_15px_rgba(6,182,212,0.6)] transition-all duration-300 active:scale-95">
          <mat-icon
            class="send-icon text-white text-lg transition-transform group-hover:translate-x-0.5">send</mat-icon>
        </button>
      </div>
    </div>

  </div>
</div>
